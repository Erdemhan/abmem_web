# Builds the Docker image on a fresh GitHub runner, starts the compose stack
# with empty volumes and no .env file, and runs docker/smoke_test.sh.
name: Docker smoke test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker compose build --pull

      - name: Start stack
        run: docker compose up -d

      - name: Smoke test
        run: sh docker/smoke_test.sh http://127.0.0.1:8000

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
