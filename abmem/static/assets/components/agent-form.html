<agent-form>
    <div class="card-body">
        <form role="form text-left" id="agent-form" method="post" action="create">
            {% csrf_token %}
            <!-- Agent bilgileri için alanlar -->
            <div class="mb-3">
                <input type="text" id="agent_name" name="name" class="form-control" placeholder="Name" aria-label="Name" aria-describedby="password-addon" required>
            </div>
            <div class="mb-3">
                <input type="number" id="budget" name="budget" class="form-control" placeholder="Budget" aria-label="Budget" aria-describedby="password-addon" required>
            </div>
            <div class="mb-3">
                <div class="form-group">
                    <label for="type">Energy Type</label>
                    <select class="form-control" id="type" name="type">
                        <option value="" selected>Select Type</option>
                        <option value="0">Renewable</option>
                        <option value="1">Fossil</option>
                        <option value="2">Nuclear</option>
                        <option value="3">Hybrid</option>
                    </select>
                </div>
                <!-- Plant bilgileri için tablo -->
                <div class="card-body px-0 pb-2 pt-0">
                    <div class="table-responsive row">
                        <table class="table align-items-center mb-0" id="plant_table">
                            <thead>
                                <tr>
                                    <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Resource</th>
                                    <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 ">Capacity</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr id="row_template" style="display: none;">
                                    <td>
                                        <div class="form-group">
                                            <select class="form-control" id="resource_dd" name="resources[]" disabled>
                                                <option value="">Select Resource</option>
                                                {% for resource in resources %}
                                                <option value="{{ resource.id }}" data-energy-type="{{ resource.energyType.value }}">{{ resource.name }}</option>
                                                {% endfor %}
                                            </select>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="mb-3">
                                            <input type="number" name="capacities[]" class="form-control" placeholder="Capacity" aria-describedby="password-addon" required>
                                        </div>
                                        <div class="mb-3">
                                            <input type="text" name="proxy" class="form-control" placeholder="Capacity" aria-describedby="password-addon" hidden="true" value="True">
                                        </div>
                                    </td>
                                    <td>
                                        <div class="col mb-3">
                                            <button type="button" onclick="deleteRow(this)" class=" center icon icon-shape bg-gradient-danger text-center border-radius-md zoom4-1 " style="border:none;">
                                                <i class="fa-solid fa-trash mb-5"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                        <!-- Yeni Plant ekleme butonu -->
                        <button type="button" class="mt-4 col bg-gradient-primary  border-radius-md mx-3 mb-2 zoom4-1" style="border: none;" onclick="addPlantRow()">
                            <i class="fa-solid fa-pencil"></i>
                            Add Plant
                        </button>

                        <!-- Formu gönderme butonu -->
                        <button type="button" class="mt-4 col bg-gradient-success border-radius-md mx-3 mb-2 zoom4-1" style="border: none;" onclick="submitForm()" id="submit-button">
                            <i class="fas fa-plus"></i>
                            <span>Create Agent and Related</span>
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</agent-form>

{{ allowed_energy_types|json_script:"allowed-energy-types" }}
<script>
    // Agent type -> allowed energy types, rendered from resource_rules.allowed_energy_types (PLAN 2.2).
    var AGENT_FORM_ALLOWED_ENERGY_TYPES = JSON.parse(document.getElementById("allowed-energy-types").textContent);

    function agentFormAllowed(agentType) {
        if (agentType === null || agentType === undefined || agentType === "") {
            return null;
        }
        return AGENT_FORM_ALLOWED_ENERGY_TYPES[String(agentType)] || [];
    }

    function agentFormOptionAllowed(option, allowed) {
        var energyType = option.getAttribute("data-energy-type");
        return energyType === null || allowed.indexOf(Number(energyType)) !== -1;
    }

    // Plant rows of the form, without the hidden template row.
    function agentFormPlantRows() {
        return Array.prototype.filter.call(
            document.querySelectorAll("#plant_table tbody tr"),
            function (row) { return row.id !== "row_template"; }
        );
    }

    // Disable the select without an agent type, otherwise hide and disable incompatible options.
    // keepSelected leaves the currently selected option usable (stored plants of an edited agent).
    function agentFormFilterSelect(select, agentType, keepSelected) {
        var allowed = agentFormAllowed(agentType);
        if (allowed === null) {
            select.disabled = true;
            return;
        }
        select.disabled = false;
        Array.prototype.forEach.call(select.options, function (option) {
            var ok = agentFormOptionAllowed(option, allowed) || (keepSelected && option.selected);
            option.hidden = !ok;
            option.disabled = !ok;
        });
    }

    function agentFormFilterRows(keepSelected) {
        var agentType = document.getElementById("type").value;
        agentFormPlantRows().forEach(function (row) {
            var select = row.querySelector('select[name="resources[]"]');
            if (select) {
                agentFormFilterSelect(select, agentType, keepSelected);
            }
        });
    }

    // On type change: warn about and remove incompatible plant rows, then filter the remaining selects.
    // Bound through jQuery so that $("#type").change() triggers in agent-list.html reach it.
    $(document).on("change", "#type", function () {
        var allowed = agentFormAllowed(this.value);
        var incompatible = [];
        if (allowed !== null) {
            agentFormPlantRows().forEach(function (row) {
                var select = row.querySelector('select[name="resources[]"]');
                if (select && select.value !== "") {
                    var option = select.options[select.selectedIndex];
                    if (!agentFormOptionAllowed(option, allowed)) {
                        incompatible.push({ row: row, name: option.text });
                    }
                }
            });
        }
        if (incompatible.length > 0) {
            alert("These plants are not allowed for the selected agent type and will be removed: "
                + incompatible.map(function (item) { return item.name; }).join(", "));
            incompatible.forEach(function (item) { item.row.remove(); });
        }
        agentFormFilterRows(false);
    });

    function addPlantRow() {
        var table = document.getElementById("plant_table").getElementsByTagName('tbody')[0];
        var rowTemplate = document.getElementById("row_template");
        var newRow = rowTemplate.cloneNode(true);
        newRow.removeAttribute("id");
        newRow.style.display = "table-row";

        var selectElement = newRow.querySelector('select[name="resources[]"]');
        selectElement.value = "";
        var inputElement = newRow.querySelector('input[name="capacities[]"]');
        inputElement.value = "";

        table.appendChild(newRow);
        agentFormFilterSelect(selectElement, document.getElementById("type").value, false);
    }

    function deleteRow(button) {
        var row = button.closest("tr");
        row.remove();
    }

    function submitForm() {
        var agentName = document.getElementById("agent_name").value.trim();
        var budget = document.getElementById("budget").value.trim();
        var energyType = document.getElementById("type").value;

        if (agentName === "" || budget === "" || energyType === "") {
            alert("Please fill in all agent details.");
            return;
        }

        var rows = document.querySelectorAll("#plant_table tbody tr");
        var resourcesAdded = false;

        for (var i = 0; i < rows.length; i++) {
            var resourceSelect = rows[i].querySelector('select[name="resources[]"]');
            var capacityInput = rows[i].querySelector('input[name="capacities[]"]');

            if (resourceSelect.value !== "" && capacityInput.value !== "") {
                resourcesAdded = true;
            }

            if (!capacityInput.closest("#row_template") && (resourceSelect.value === "" || capacityInput.value === "")) {
                alert("Please fill in all resource details.");
                return;
            }
        }

        if (!resourcesAdded) {
            alert("Please add at least one resource.");
            return;
        }

        var rowTemplate = document.getElementById("row_template");
        rowTemplate.remove();

        var agentData = {
            name: agentName,
            budget: budget,
            type: energyType
        };

        var agents = JSON.parse(localStorage.getItem("agents")) || [];
        agents.push(agentData);
        localStorage.setItem("agents", JSON.stringify(agents));

        $("#agent-modal").modal('hide');

        // Clear the form for the next agent
        document.getElementById("agent-form").reset();
    }
</script>
