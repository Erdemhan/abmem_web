[pytest]
DJANGO_SETTINGS_MODULE = web_project.settings
python_files = test_*.py
testpaths = tests
# The tracked migration chain cannot be applied to an empty database
# (0001_initial creates agent.seed and 0002 adds it again), so the test schema
# is built directly from the models until the migrations are repaired.
addopts = --nomigrations
markers =
    characterization: pins the current behaviour of the code base so later refactors can be checked
    characterization_changes_in_1_7: pins current defective behaviour, expected to change in PLAN 1.7
    smoke: fast end-to-end sanity checks
